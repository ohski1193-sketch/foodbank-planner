<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>푸드뱅크 통합 배송 & 특이사항 플래너</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (v9 호환 모듈) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- 카카오 지도 API -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=bb4ed44dd682ef912b4c09ba8b10845f&libraries=services"></script>

    <!-- 카카오 내비 SDK 추가 -->
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>

    <style>
        body { font-family: 'Pretendard', sans-serif; }
        
        /* 테슬라 다크모드 스타일 지도를 위한 CSS 필터 */
        .tesla-map-container #map {
            filter: invert(90%) hue-rotate(180deg) brightness(95%) contrast(90%);
        }
        .tesla-map-container .custom-overlay {
            filter: invert(0%) hue-rotate(0deg) !important;
        }
    </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 pb-12">
    <div class="max-w-5xl mx-auto p-4 sm:p-6">
        
        <!-- 상단 헤더 -->
        <header class="bg-slate-800 border border-slate-700 text-white p-5 rounded-2xl shadow-lg mb-5 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
            <div>
                <h1 class="text-2xl font-bold flex items-center gap-2">
                    🚚 <span class="text-emerald-400">나주시 기초푸드뱅크</span> 경로안내
                </h1>
                <p class="text-slate-400 text-xs mt-1">전직원 실시간 동기화 주간 배송지 & 테슬라 스타일 지도 플래너</p>
            </div>
            <div id="header-badge" class="bg-emerald-950 text-emerald-400 border border-emerald-700 px-4 py-2 rounded-xl text-xs font-semibold">
                진행률: 0 / 0건 (0%)
            </div>
        </header>

        <!-- 메인 탭 -->
        <div class="flex gap-2 mb-6 bg-slate-800 p-1.5 rounded-2xl border border-slate-700">
            <button type="button" onclick="switchMainTab('delivery')" id="main-tab-delivery" class="flex-1 py-3 rounded-xl font-bold text-xs sm:text-sm text-center transition bg-emerald-600 text-white shadow-sm">
                🚛 주간 배송 목록 & 지도
            </button>
            <button type="button" onclick="switchMainTab('calendar')" id="main-tab-calendar" class="flex-1 py-3 rounded-xl font-bold text-xs sm:text-sm text-center transition text-slate-400 hover:text-slate-200">
                📅 배송 특이사항
            </button>
            <button type="button" onclick="switchMainTab('places')" id="main-tab-places" class="flex-1 py-3 rounded-xl font-bold text-xs sm:text-sm text-center transition text-slate-400 hover:text-slate-200">
                📍 전체 배송지 관리
            </button>
        </div>

        <!-- ==================== 1. 주간 배송 & 지도 통합 섹션 ==================== -->
        <div id="section-delivery" class="flex flex-col gap-5">
            <!-- 요일 선택 탭 -->
            <div class="flex gap-2">
                <button type="button" onclick="changeDay('월')" id="tab-월" class="day-btn flex-1 py-3 rounded-xl font-bold text-sm bg-slate-800 text-slate-400 border border-slate-700 shadow-sm">월</button>
                <button type="button" onclick="changeDay('화')" id="tab-화" class="day-btn flex-1 py-3 rounded-xl font-bold text-sm bg-slate-800 text-slate-400 border border-slate-700 shadow-sm">화</button>
                <button type="button" onclick="changeDay('수')" id="tab-수" class="day-btn flex-1 py-3 rounded-xl font-bold text-sm bg-slate-800 text-slate-400 border border-slate-700 shadow-sm">수</button>
                <button type="button" onclick="changeDay('목')" id="tab-목" class="day-btn flex-1 py-3 rounded-xl font-bold text-sm bg-slate-800 text-slate-400 border border-slate-700 shadow-sm">목</button>
                <button type="button" onclick="changeDay('금')" id="tab-금" class="day-btn flex-1 py-3 rounded-xl font-bold text-sm bg-slate-800 text-slate-400 border border-slate-700 shadow-sm">금</button>
            </div>

            <!-- 1) 다음 배송 목적지 실시간 안내 배너 -->
            <div id="next-target-banner" class="bg-slate-800 border-2 border-emerald-500 p-4 rounded-2xl flex justify-between items-center shadow-lg hidden">
                <div>
                    <span class="text-xs text-emerald-400 font-extrabold tracking-wide uppercase">📍 다음 배송 목적지</span>
                    <h3 id="next-target-name" class="text-lg font-bold text-white mt-0.5">배송처 이름</h3>
                    <p id="next-target-addr" class="text-xs text-slate-400 mt-0.5">주소 정보</p>
                </div>
                <button type="button" id="next-target-navi-btn" class="bg-emerald-600 text-white font-bold text-xs px-4 py-3 rounded-xl shadow-md hover:bg-emerald-500 transition flex items-center gap-1">
                    🚀 카카오내비 길안내
                </button>
            </div>

            <!-- 2) 테슬라 스타일 실시간 동선 지도 영역 -->
            <div class="tesla-map-container bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700 flex flex-col gap-3">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h2 class="text-base font-bold text-white flex items-center gap-2">
                        🗺️ <span id="map-day-title" class="text-emerald-400">월요일</span> 실시간 지도 동선 (Tesla Dark)
                    </h2>
                    <button type="button" onclick="getCurrentLocation()" class="text-xs bg-slate-700 hover:bg-slate-600 text-emerald-400 font-bold px-3 py-1.5 rounded-lg border border-slate-600 transition">
                        📍 내 위치 추적
                    </button>
                </div>
                <div id="map" class="w-full h-[400px] rounded-xl overflow-hidden border border-slate-700"></div>
            </div>

            <!-- 3) 요일별 배송 동선 목록 -->
            <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2 mb-4">
                    <h2 class="text-base font-bold text-white">
                        📋 <span id="title-day" class="text-emerald-400">월요일</span> 상세 배송 목록 (<span id="count-num">0</span>건)
                    </h2>
                    <span class="text-xs text-slate-400">⚡ 실시간 전체 공유 중</span>
                </div>
                <div id="list-container" class="flex flex-col gap-3 max-h-[500px] overflow-y-auto pr-1"></div>

                <div class="border-t border-slate-700 pt-3 mt-4 flex gap-2">
                    <button type="button" onclick="handleReset()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-xl text-xs transition">
                        🔄 오늘 일정 완료 (배송대기로 초기화)
                    </button>
                    <button type="button" onclick="handleDeleteAll()" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 font-medium py-2 rounded-xl text-xs transition">
                        이 요일 배송지 전체 삭제
                    </button>
                </div>
            </div>
        </div>

        <!-- ==================== 2. 배송 특이사항 (캘린더) 섹션 ==================== -->
        <div id="section-calendar" class="hidden flex-col gap-5">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700">
                    <div class="flex justify-between items-center mb-4">
                        <button type="button" onclick="prevMonth()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-bold">◀ 이전달</button>
                        <h2 id="calendar-month-year" class="font-bold text-base text-white">2026년 10월</h2>
                        <button type="button" onclick="nextMonth()" class="px-3 py-1 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-bold">다음달 ▶</button>
                    </div>
                    <div class="grid grid-cols-7 gap-1 text-center text-xs font-bold text-slate-400 mb-2">
                        <span class="text-rose-400">일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span class="text-blue-400">토</span>
                    </div>
                    <div id="calendar-days" class="grid grid-cols-7 gap-1 text-center text-xs"></div>
                </div>

                <div class="md:col-span-2 flex flex-col gap-5">
                    <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700 flex flex-col gap-3">
                        <h3 class="font-bold text-sm text-white border-b border-slate-700 pb-2 flex justify-between items-center">
                            <span>📝 <span id="selected-date-label" class="text-emerald-400">날짜를 선택하세요</span> 현장 특이사항</span>
                        </h3>
                        <textarea id="calendar-note-input" rows="3" placeholder="해당 날짜의 주요 특이사항, 배송지 이슈 등을 자유롭게 기록하세요..." class="w-full p-3 bg-slate-900 border border-slate-700 text-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
                        <div class="flex gap-2 justify-end">
                            <button type="button" onclick="saveCalendarNote()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-xl text-xs">
                                특이사항 실시간 저장
                            </button>
                        </div>
                    </div>

                    <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700 flex flex-col gap-3">
                        <h3 class="font-bold text-sm text-white border-b border-slate-700 pb-2">📋 등록된 전체 특이사항 기록부</h3>
                        <div id="calendar-notes-list" class="flex flex-col gap-2 max-h-[350px] overflow-y-auto pr-1"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 3. 전체 배송지 관리 독립 섹션 ==================== -->
        <div id="section-places" class="hidden flex-col gap-5">
            <!-- 1) 신규 배송지 등록 및 수정 폼 -->
            <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700 flex flex-col gap-3">
                <h2 id="form-title" class="text-base font-bold text-white border-b border-slate-700 pb-2">
                    ➕ 배송지 신규 등록
                </h2>

                <input type="hidden" id="edit-place-id" value="">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">배송처명 *</label>
                        <input type="text" id="input-name" placeholder="예: 효사랑 나눔의집" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 text-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">도로명 주소 *</label>
                        <input type="text" id="input-address" placeholder="예: 전남 나주시 빛가람로 100" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 text-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">연락처</label>
                        <input type="text" id="input-phone" placeholder="예: 061-123-4567" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 text-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-400 mb-1">배송 물량 / 기본 품목</label>
                        <input type="text" id="input-item" placeholder="예: 식료품 상자 3개" class="w-full px-3 py-2 bg-slate-900 border border-slate-700 text-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <div class="flex gap-2 mt-2">
                    <button type="button" id="btn-save-place" onclick="handleSavePlace()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-xl text-sm transition shadow-sm">
                        + 전체 배송지 목록에 등록하기
                    </button>
                    <button type="button" id="btn-cancel-edit" onclick="cancelEditMode()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold py-2.5 px-4 rounded-xl text-sm transition hidden">
                        취소
                    </button>
                </div>
            </div>

            <!-- 2) 등록된 배송지 전체 목록 & 수정/요일 추가 -->
            <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700 flex flex-col gap-3">
                <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                    <h2 class="text-base font-bold text-white">
                        ⭐ 등록된 배송지 목록 (<span id="total-places-count">0</span>곳)
                    </h2>
                    <span class="text-xs text-slate-400">원하는 요일 버튼을 눌러 동선에 추가하세요</span>
                </div>
                <div id="registered-places-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[500px] overflow-y-auto pr-1"></div>
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAe6NjvfbsGlaXcA3Z3ncEihHpP2CGtPgo",
            authDomain: "najufoodbank.firebaseapp.com",
            databaseURL: "https://najufoodbank-default-rtdb.firebaseio.com",
            projectId: "najufoodbank",
            storageBucket: "najufoodbank.firebasestorage.app",
            messagingSenderId: "476867511482",
            appId: "1:476867511482:web:8402d210fba4d7fc516e83"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let store = { '월': [], '화': [], '수': [], '목': [], '금': [] };
        let registeredPlaces = [];
        let calendarNotes = {};
        let currentDay = '월';

        let map = null;
        let mapMarkers = [];
        let userLocationMarker = null;
        let geocoder = null;

        let today = new Date();
        let calYear = today.getFullYear();
        let calMonth = today.getMonth();
        let selectedDateStr = formatDate(today.getFullYear(), today.getMonth() + 1, today.getDate());

        window.addEventListener('DOMContentLoaded', () => {
            // 카카오 JavaScript SDK 초기화
            // 카카오 개발자 콘솔의 'JavaScript 키'를 사용하고,
            // 실제 웹앱 주소를 JavaScript SDK 도메인에 등록해야 합니다.
            if (typeof Kakao !== 'undefined') {
                try {
                    if (!Kakao.isInitialized()) {
                        Kakao.init('bb4ed44dd682ef912b4c09ba8b10845f');
                    }
                    console.info('Kakao SDK initialized:', Kakao.isInitialized());
                } catch (error) {
                    console.error('Kakao SDK initialization failed:', error);
                }
            } else {
                console.warn('Kakao JavaScript SDK를 불러오지 못했습니다.');
            }

            db.ref('delivery_store').on('value', (snapshot) => {
                store = snapshot.val() || { '월': [], '화': [], '수': [], '목': [], '금': [] };
                renderDelivery();
                renderMap();
            });

            db.ref('registered_places').on('value', (snapshot) => {
                registeredPlaces = snapshot.val() || [];
                renderRegisteredPlaces();
            });

            db.ref('calendar_notes').on('value', (snapshot) => {
                calendarNotes = snapshot.val() || {};
                renderCalendar();
                selectCalendarDate(selectedDateStr);
            });

            changeDay('월');
            setTimeout(() => { initMap(); }, 300);
        });

        function switchMainTab(tab) {
            const delSec = document.getElementById('section-delivery');
            const calSec = document.getElementById('section-calendar');
            const plcSec = document.getElementById('section-places');

            const delBtn = document.getElementById('main-tab-delivery');
            const calBtn = document.getElementById('main-tab-calendar');
            const plcBtn = document.getElementById('main-tab-places');

            delSec.classList.add('hidden');
            calSec.classList.add('hidden');
            plcSec.classList.add('hidden');

            delBtn.className = "flex-1 py-3 rounded-xl font-bold text-xs sm:text-sm text-center transition text-slate-400 hover:text-slate-200";
            calBtn.className = "flex-1 py-3 rounded-xl font-bold text-xs sm:text-sm text-center transition text-slate-400 hover:text-slate-200";
            plcBtn.className = "flex-1 py-3 rounded-xl font-bold text-xs sm:text-sm text-center transition text-slate-400 hover:text-slate-200";

            if (tab === 'delivery') {
                delSec.classList.remove('hidden');
                delBtn.className = "flex-1 py-3 rounded-xl font-bold text-xs sm:text-sm text-center transition bg-emerald-600 text-white shadow-sm";
                setTimeout(() => { if (map) map.relayout(); renderMap(); }, 100);
            } else if (tab === 'calendar') {
                calSec.classList.remove('hidden');
                calBtn.className = "flex-1 py-3 rounded-xl font-bold text-xs sm:text-sm text-center transition bg-emerald-600 text-white shadow-sm";
            } else if (tab === 'places') {
                plcSec.classList.remove('hidden');
                plcBtn.className = "flex-1 py-3 rounded-xl font-bold text-xs sm:text-sm text-center transition bg-emerald-600 text-white shadow-sm";
            }
        }

        function changeDay(day) {
            currentDay = day;
            document.querySelectorAll('.day-btn').forEach(btn => {
                btn.className = "day-btn flex-1 py-3 rounded-xl font-bold text-sm bg-slate-800 text-slate-400 border border-slate-700 shadow-sm";
            });
            const activeBtn = document.getElementById(`tab-${day}`);
            if(activeBtn) activeBtn.className = "day-btn flex-1 py-3 rounded-xl font-bold text-sm bg-emerald-600 text-white shadow-md border border-emerald-600";

            document.getElementById('title-day').textContent = `${day}요일`;
            document.getElementById('map-day-title').textContent = `${day}요일`;

            renderDelivery();
            renderMap();
        }

        // --- 지도 로직 ---
        function initMap() {
            if (typeof kakao === 'undefined' || !kakao.maps) return;
            const mapContainer = document.getElementById('map');
            if (!map) {
                const options = { center: new kakao.maps.LatLng(35.016, 126.716), level: 7 };
                map = new kakao.maps.Map(mapContainer, options);
                geocoder = new kakao.maps.services.Geocoder();
                getCurrentLocation();
            }
            renderMap();
        }

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const locPosition = new kakao.maps.LatLng(lat, lon);

                    if (userLocationMarker) userLocationMarker.setMap(null);

                    userLocationMarker = new kakao.maps.Marker({
                        map: map,
                        position: locPosition
                    });

                    map.setCenter(locPosition);
                });
            }
        }

        function renderMap() {
            if (!map || typeof kakao === 'undefined' || !kakao.maps) return;

            mapMarkers.forEach(m => m.setMap(null));
            mapMarkers = [];

            const list = store[currentDay] || [];
            if (list.length === 0) return;

            const bounds = new kakao.maps.LatLngBounds();

            list.forEach((item, idx) => {
                geocoder.addressSearch(item.address, function(result, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
                        const marker = new kakao.maps.Marker({ map: map, position: coords });
                        mapMarkers.push(marker);
                        bounds.extend(coords);

                        const infowindow = new kakao.maps.InfoWindow({
                            content: `<div class="custom-overlay" style="padding:6px 10px;font-size:12px;font-weight:bold;color:#000;">${idx + 1}. ${item.name}</div>`
                        });
                        kakao.maps.event.addListener(marker, 'click', function() {
                            infowindow.open(map, marker);
                        });
                        map.setBounds(bounds);
                    }
                });
            });
        }

        function saveStoreToFirebase() { db.ref('delivery_store').set(store); }
        function saveRegisteredPlacesToFirebase() { db.ref('registered_places').set(registeredPlaces); }
        function saveCalendarToFirebase() { db.ref('calendar_notes').set(calendarNotes); }

        function handleSavePlace() {
            const editId = document.getElementById('edit-place-id').value;
            const name = document.getElementById('input-name').value.trim();
            const address = document.getElementById('input-address').value.trim();
            const phone = document.getElementById('input-phone').value.trim();
            const item = document.getElementById('input-item').value.trim();

            if (!name || !address) { alert('배송처명과 주소는 필수 입력 항목입니다!'); return; }

            if (editId) {
                const idx = registeredPlaces.findIndex(x => x.id == editId);
                if (idx !== -1) {
                    registeredPlaces[idx].name = name;
                    registeredPlaces[idx].address = address;
                    registeredPlaces[idx].phone = phone || '연락처 없음';
                    registeredPlaces[idx].item = item || '기본 물량';
                    saveRegisteredPlacesToFirebase();
                    alert(`'${name}' 배송지 정보가 수정되었습니다!`);
                }
            } else {
                const newPlace = {
                    id: Date.now(),
                    name: name,
                    address: address,
                    phone: phone || '연락처 없음',
                    item: item || '기본 물량'
                };
                registeredPlaces.push(newPlace);
                saveRegisteredPlacesToFirebase();
                alert(`'${name}' 배송지가 등록되었습니다!`);
            }

            cancelEditMode();
        }

        function startEditPlace(id) {
            const target = registeredPlaces.find(x => x.id == id);
            if (!target) return;

            document.getElementById('edit-place-id').value = target.id;
            document.getElementById('input-name').value = target.name;
            document.getElementById('input-address').value = target.address;
            document.getElementById('input-phone').value = target.phone === '연락처 없음' ? '' : target.phone;
            document.getElementById('input-item').value = target.item === '기본 물량' ? '' : target.item;

            document.getElementById('form-title').textContent = `✏️ 배송지 정보 수정 (${target.name})`;
            document.getElementById('btn-save-place').textContent = `💾 배송지 정보 수정 완료`;
            document.getElementById('btn-save-place').className = `w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2.5 px-4 rounded-xl text-sm transition shadow-sm`;
            document.getElementById('btn-cancel-edit').classList.remove('hidden');

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function cancelEditMode() {
            document.getElementById('edit-place-id').value = '';
            document.getElementById('input-name').value = '';
            document.getElementById('input-address').value = '';
            document.getElementById('input-phone').value = '';
            document.getElementById('input-item').value = '';

            document.getElementById('form-title').textContent = `➕ 배송지 신규 등록`;
            document.getElementById('btn-save-place').textContent = `+ 전체 배송지 목록에 등록하기`;
            document.getElementById('btn-save-place').className = `w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 px-4 rounded-xl text-sm transition shadow-sm`;
            document.getElementById('btn-cancel-edit').classList.add('hidden');
        }

        function addPlaceToDay(place, day) {
            const itemData = {
                id: Date.now(),
                name: place.name,
                address: place.address,
                phone: place.phone,
                item: place.item,
                memo: '',
                done: false
            };

            if (!store[day]) store[day] = [];
            store[day].push(itemData);
            saveStoreToFirebase();
            alert(`'${place.name}' 배송지가 ${day}요일 동선에 배정되었습니다!`);
        }

        function deleteRegisteredPlace(id) {
            if (confirm('이 배송지를 저장소 모음에서 완전히 삭제하시겠습니까?')) {
                registeredPlaces = registeredPlaces.filter(x => x.id !== id);
                saveRegisteredPlacesToFirebase();
            }
        }

        function renderRegisteredPlaces() {
            const container = document.getElementById('registered-places-container');
            document.getElementById('total-places-count').textContent = registeredPlaces.length;

            if (registeredPlaces.length === 0) {
                container.innerHTML = `<div class="text-slate-400 text-xs col-span-2 py-8 text-center bg-slate-900 rounded-xl border border-slate-700">등록된 배송지가 없습니다. 위 폼에서 배송지를 등록해 보세요!</div>`;
                return;
            }

            let html = '';
            registeredPlaces.forEach((place) => {
                html += `
                    <div class="p-3 bg-slate-900 border border-slate-700 rounded-xl flex flex-col gap-2 shadow-sm">
                        <div class="flex justify-between items-start">
                            <div class="overflow-hidden">
                                <h4 class="font-bold text-xs text-white truncate">${place.name}</h4>
                                <p class="text-[11px] text-slate-400 truncate">📍 ${place.address}</p>
                                <p class="text-[11px] text-slate-500 truncate">📞 ${place.phone} | 📦 ${place.item}</p>
                            </div>
                            <div class="flex items-center gap-1">
                                <button type="button" onclick="startEditPlace(${place.id})" class="text-slate-300 hover:text-blue-400 text-xs font-bold px-1.5 py-0.5 bg-slate-800 rounded transition">✏️ 수정</button>
                                <button type="button" onclick="deleteRegisteredPlace(${place.id})" class="text-slate-500 hover:text-rose-400 text-xs font-bold px-1">✕</button>
                            </div>
                        </div>
                        <div class="flex items-center justify-between border-t border-slate-800 pt-2 gap-1">
                            <span class="text-[11px] font-bold text-slate-400">동선 배정:</span>
                            <div class="flex gap-1">
                                <button type="button" onclick="addPlaceToDay(${JSON.stringify(place).replace(/"/g, '&quot;')}, '월')" class="bg-emerald-950 hover:bg-emerald-600 hover:text-white text-emerald-400 font-bold text-xs px-2 py-0.5 rounded border border-emerald-700 transition">월</button>
                                <button type="button" onclick="addPlaceToDay(${JSON.stringify(place).replace(/"/g, '&quot;')}, '화')" class="bg-emerald-950 hover:bg-emerald-600 hover:text-white text-emerald-400 font-bold text-xs px-2 py-0.5 rounded border border-emerald-700 transition">화</button>
                                <button type="button" onclick="addPlaceToDay(${JSON.stringify(place).replace(/"/g, '&quot;')}, '수')" class="bg-emerald-950 hover:bg-emerald-600 hover:text-white text-emerald-400 font-bold text-xs px-2 py-0.5 rounded border border-emerald-700 transition">수</button>
                                <button type="button" onclick="addPlaceToDay(${JSON.stringify(place).replace(/"/g, '&quot;')}, '목')" class="bg-emerald-950 hover:bg-emerald-600 hover:text-white text-emerald-400 font-bold text-xs px-2 py-0.5 rounded border border-emerald-700 transition">목</button>
                                <button type="button" onclick="addPlaceToDay(${JSON.stringify(place).replace(/"/g, '&quot;')}, '금')" class="bg-emerald-950 hover:bg-emerald-600 hover:text-white text-emerald-400 font-bold text-xs px-2 py-0.5 rounded border border-emerald-700 transition">금</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function moveItem(index, direction) {
            const list = store[currentDay];
            const targetIdx = index + direction;
            if (targetIdx < 0 || targetIdx >= list.length) return;
            const temp = list[index];
            list[index] = list[targetIdx];
            list[targetIdx] = temp;
            saveStoreToFirebase();
        }

        function moveItemToAnotherDay(index) {
            const days = ['월', '화', '수', '목', '금'];
            const targetDay = prompt(`어느 요일로 이동하시겠습니까? (입력 예: 월, 화, 수, 목, 금)`, currentDay === '월' ? '화' : '월');
            if (!targetDay || !days.includes(targetDay)) return;
            if (targetDay === currentDay) return;

            const item = store[currentDay].splice(index, 1)[0];
            if (!store[targetDay]) store[targetDay] = [];
            store[targetDay].push(item);
            saveStoreToFirebase();
        }

        function toggleDone(id) {
            const target = store[currentDay].find(x => x.id === id);
            if (target) { target.done = !target.done; saveStoreToFirebase(); }
        }

        function updateMemo(id, text) {
            const target = store[currentDay].find(x => x.id === id);
            if (target) { target.memo = text; saveStoreToFirebase(); }
        }

        function deleteItem(id) {
            store[currentDay] = store[currentDay].filter(x => x.id !== id);
            saveStoreToFirebase();
        }

        function handleReset() {
            if (!store[currentDay] || store[currentDay].length === 0) return;
            if (confirm(`${currentDay}요일 배송 상태를 모두 '대기'로 되돌리시겠습니까?`)) {
                store[currentDay].forEach(x => x.done = false);
                saveStoreToFirebase();
            }
        }

        function handleDeleteAll() {
            if (!store[currentDay] || store[currentDay].length === 0) return;
            if (confirm(`정말로 ${currentDay}요일의 모든 배송지를 삭제하시겠습니까?`)) {
                store[currentDay] = [];
                saveStoreToFirebase();
            }
        }

        // --- 카카오내비 앱 다이렉트 연동 함수 ---
        function goNavi(app, address, placeName = '') {
            const encoded = encodeURIComponent(address);

            if (app === 'kakao') {
                const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

                if (!isMobile) {
                    window.open(`https://map.kakao.com/link/search/${encoded}`, '_blank');
                    return;
                }

                if (typeof kakao === 'undefined' || !kakao.maps || !geocoder) {
                    alert('카카오 지도 API를 불러오지 못했습니다.');
                    return;
                }

                geocoder.addressSearch(address, function(result, status) {
                    if (status === kakao.maps.services.Status.OK && result.length > 0) {
                        const x = Number(result[0].x);
                        const y = Number(result[0].y);
                        const name = placeName || address;

                        if (typeof Kakao !== 'undefined' && Kakao.isInitialized && Kakao.isInitialized() && Kakao.Navi) {
                            Kakao.Navi.start({
                                name: name,
                                x: x,
                                y: y,
                                coordType: 'wgs84'
                            });
                        } else {
                            window.location.href = `https://map.kakao.com/link/search/${encoded}`;
                        }
                    } else {
                        alert('주소를 좌표로 변환하지 못했습니다. 주소를 확인해 주세요.');
                    }
                });

                return;
            }

            if (app === 'tmap') {
                window.open(`https://surl.tmap.co.kr/search?keyword=${encoded}`, '_blank');
            }

            if (app === 'naver') {
                window.open(`https://map.naver.com/v5/search/${encoded}`, '_blank');
            }
        }

        function renderDelivery() {
            const container = document.getElementById('list-container');
            const list = store[currentDay] || [];

            document.getElementById('count-num').textContent = list.length;
            const doneCount = list.filter(x => x.done).length;
            const totalCount = list.length;
            const pct = totalCount > 0 ? Math.round((doneCount / totalCount) * 100) : 0;
            document.getElementById('header-badge').textContent = `진행률: ${doneCount} / ${totalCount}건 (${pct}%)`;

            const nextTarget = list.find(x => !x.done);
            const banner = document.getElementById('next-target-banner');

            if (nextTarget) {
                document.getElementById('next-target-name').textContent = nextTarget.name;
                document.getElementById('next-target-addr').textContent = nextTarget.address;
                document.getElementById('next-target-navi-btn').onclick = () => goNavi('kakao', nextTarget.address, nextTarget.name);
                banner.classList.remove('hidden');
            } else {
                banner.classList.add('hidden');
            }

            if (list.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-sm bg-slate-900 rounded-xl border border-dashed border-slate-700">📍 ${currentDay}요일에 배정된 배송지가 없습니다.<br>[전체 배송지 관리] 탭에서 요일 버튼을 눌러 동선에 추가해 보세요!</div>`;
                return;
            }

            let html = '';
            list.forEach((item, index) => {
                html += `
                    <div class="p-4 rounded-xl border ${item.done ? 'bg-slate-900 border-slate-800 opacity-50' : 'bg-slate-900 border-slate-700 shadow-md'} flex flex-col gap-2.5">
                        <div class="flex justify-between items-center">
                            <div class="flex items-center gap-2">
                                <span class="bg-emerald-600 text-white w-5 h-5 rounded-full flex items-center justify-center text-xs font-bold">${index + 1}</span>
                                <h3 class="font-bold text-white text-sm ${item.done ? 'line-through text-slate-500' : ''}">${item.name}</h3>
                            </div>
                            <div class="flex items-center gap-1">
                                <button type="button" onclick="moveItem(${index}, -1)" class="text-slate-400 hover:text-slate-200 text-xs px-1 font-bold" title="위로">▲</button>
                                <button type="button" onclick="moveItem(${index}, 1)" class="text-slate-400 hover:text-slate-200 text-xs px-1 font-bold" title="아래로">▼</button>
                                <button type="button" onclick="moveItemToAnotherDay(${index})" class="text-xs text-blue-400 hover:text-blue-300 font-bold px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded">요일이동</button>
                                <button type="button" onclick="toggleDone(${item.id})" class="text-xs px-2.5 py-1 rounded-lg font-bold ${item.done ? 'bg-emerald-600 text-white' : 'bg-amber-900 text-amber-200 border border-amber-700'}">
                                    ${item.done ? '✓ 완료' : '⏳ 대기'}
                                </button>
                                <button type="button" onclick="deleteItem(${item.id})" class="text-slate-500 hover:text-rose-400 text-xs font-bold px-1">✕</button>
                            </div>
                        </div>
                        <div class="text-xs text-slate-300 bg-slate-950 p-2.5 rounded-lg border border-slate-800 flex flex-col gap-0.5">
                            <p class="font-semibold text-slate-200">📍 주소: ${item.address}</p>
                            <p>📞 연락처: ${item.phone}</p>
                            <p class="text-emerald-400 font-medium">📦 물량: ${item.item}</p>
                        </div>
                        <div>
                            <input type="text" value="${item.memo || ''}" onchange="updateMemo(${item.id}, this.value)" placeholder="📝 현장 특이사항 메모 (자동저장)" class="w-full px-2.5 py-1 border border-slate-700 rounded-lg text-xs bg-slate-950 text-slate-200 focus:outline-none focus:ring-1 focus:ring-emerald-500">
                        </div>
                        <div class="flex gap-1.5 pt-1">
                            <button type="button" onclick="goNavi('kakao', '${item.address}', '${item.name}')" class="flex-1 bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-1.5 rounded-lg text-xs">카카오내비</button>
                            <button type="button" onclick="goNavi('tmap', '${item.address}')" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-1.5 rounded-lg text-xs">TMAP</button>
                            <button type="button" onclick="goNavi('naver', '${item.address}')" class="flex-1 bg-green-600 hover:bg-green-500 text-white font-bold py-1.5 rounded-lg text-xs">네이버지도</button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function formatDate(y, m, d) {
            const mm = m < 10 ? '0' + m : m;
            const dd = d < 10 ? '0' + d : d;
            return `${y}-${mm}-${dd}`;
        }

        function prevMonth() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
        function nextMonth() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }

        function renderCalendar() {
            document.getElementById('calendar-month-year').textContent = `${calYear}년 ${calMonth + 1}월`;
            const daysContainer = document.getElementById('calendar-days');
            daysContainer.innerHTML = '';
            const firstDay = new Date(calYear, calMonth, 1).getDay();
            const lastDate = new Date(calYear, calMonth + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) {
                const emptyCell = document.createElement('div');
                emptyCell.className = "h-9";
                daysContainer.appendChild(emptyCell);
            }

            for (let date = 1; date <= lastDate; date++) {
                const dateStr = formatDate(calYear, calMonth + 1, date);
                const isSelected = dateStr === selectedDateStr;
                const hasNote = calendarNotes[dateStr] && calendarNotes[dateStr].trim() !== '';

                const cell = document.createElement('button');
                cell.type = 'button';
                cell.onclick = () => selectCalendarDate(dateStr);

                let baseClass = "h-9 rounded-lg font-medium flex flex-col items-center justify-center relative transition ";
                if (isSelected) baseClass += "bg-emerald-600 text-white font-bold shadow-sm ";
                else baseClass += "hover:bg-slate-700 text-slate-300 ";

                cell.className = baseClass;
                cell.innerHTML = `<span>${date}</span>`;

                if (hasNote) {
                    const dot = document.createElement('span');
                    dot.className = isSelected ? "w-1.5 h-1.5 bg-white rounded-full mt-0.5" : "w-1.5 h-1.5 bg-emerald-400 rounded-full mt-0.5";
                    cell.appendChild(dot);
                }
                daysContainer.appendChild(cell);
            }
            renderCalendarNotesList();
        }

        function selectCalendarDate(dateStr) {
            selectedDateStr = dateStr;
            document.getElementById('selected-date-label').textContent = dateStr;
            document.getElementById('calendar-note-input').value = calendarNotes[dateStr] || '';
            renderCalendar();
        }

        function saveCalendarNote() {
            const text = document.getElementById('calendar-note-input').value.trim();
            if (text) calendarNotes[selectedDateStr] = text;
            else delete calendarNotes[selectedDateStr];
            saveCalendarToFirebase();
            alert(`${selectedDateStr} 특이사항이 공유 저장되었습니다.`);
        }

        function deleteCalendarNote(dateStr) {
            if (confirm(`${dateStr} 특이사항을 삭제하시겠습니까?`)) {
                delete calendarNotes[dateStr];
                saveCalendarToFirebase();
                if (selectedDateStr === dateStr) document.getElementById('calendar-note-input').value = '';
            }
        }

        function renderCalendarNotesList() {
            const listContainer = document.getElementById('calendar-notes-list');
            const dates = Object.keys(calendarNotes).sort().reverse();

            if (dates.length === 0) {
                listContainer.innerHTML = `<div class="text-center py-8 text-slate-400 text-xs bg-slate-900 rounded-xl border border-dashed border-slate-700">등록된 특이사항 기록이 없습니다.</div>`;
                return;
            }

            let html = '';
            dates.forEach(dStr => {
                html += `
                    <div class="p-3 bg-slate-900 border border-slate-700 rounded-xl flex justify-between items-start gap-2">
                        <div class="flex flex-col gap-1">
                            <span class="font-bold text-xs text-emerald-400">📅 ${dStr}</span>
                            <p class="text-xs text-slate-300 whitespace-pre-wrap">${calendarNotes[dStr]}</p>
                        </div>
                        <div class="flex gap-1">
                            <button type="button" onclick="selectCalendarDate('${dStr}')" class="text-xs text-slate-400 hover:text-emerald-400 font-bold px-1.5 py-0.5">수정</button>
                            <button type="button" onclick="deleteCalendarNote('${dStr}')" class="text-xs text-rose-400 hover:text-rose-300 font-bold px-1.5 py-0.5">✕</button>
                        </div>
                    </div>
                `;
            });
            listContainer.innerHTML = html;
        }
    </script>
</body>
</html>
